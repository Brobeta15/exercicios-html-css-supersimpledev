<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        img{
            width: 40px;
            border-radius: 40px;
            vertical-align: middle;
            
        }
        .text-box{
            font-family: Arial;
            color: rgb(97, 93, 93);
            vertical-align: middle;
            width: 270px;
            font-size: medium;
            margin-left: 4px;
            border: none;
        }
        button{
            background-color: rgb(92, 153, 233);
            color: white;
            border: none;
            vertical-align: middle;
            border-radius: 15px;
            padding: 8px;
            font-weight: bold;
            width: 70px;
            cursor: pointer;
        }

        .div-principal{
            margin: 50px;
            height: 50px;
            width: 418px;
            padding-top: 10px;
            padding-left: 12px;
            
            border-radius: 5px;
            box-shadow: 0px 0px 7px rgb(158, 158, 158);
        }
        

    </style>
    <div class="div-principal">
        
            <img src="Kim-Namjoon-2.jpg" alt="">
            <input type="text" class="text-box" placeholder="What's happening?">
            <button>Tweet</button>
        
    </div>
    
</body>
</html>
