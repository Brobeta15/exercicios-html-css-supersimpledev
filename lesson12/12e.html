<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        div{
            font-family: Arial;
            
        }

        .numero{
            color: white;
            background-color: rgb(87, 87, 216);
            border-radius: 15px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 3px;
            padding-bottom: 3px;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
    <div style="border-style: solid;
                border-color: rgb(153, 150, 150);
                border-width: 1px;
                border-radius: 8px;
                width: 300px;
                padding-right: 15px;
                padding-left: 15px;
                border-style: solid;">
        <div style="flex-direction: row;
                    display: flex;
                    justify-content: space-between;
                    padding-bottom: 15px;
                    padding-top: 10px;
                    font-size: large;
                    align-items: center;">
            <div>Home</div>
            <div class="numero">14</div>
        </div>
        <div style="flex-direction: row;
                    display: flex;
                    justify-content: space-between;
                    padding-bottom: 15px;
                    font-size: large;
                    align-items: center;">
            <div>Notifications</div>
            <div class="numero">3</div>
        </div>
        <div style="flex-direction: row;
                    display: flex;
                    justify-content: space-between;
                    padding-bottom: 10px;
                    font-size: large;
                    align-items: center;">
            <div>Menssages</div>
            <div class="numero">5</div>
        </div>
    </div>

</html>
