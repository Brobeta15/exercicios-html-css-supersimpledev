<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

        div{
            font-family: Arial;
        }
        .conteiner{
            display: flex;
            flex-direction: row;
            background-color: rgb(159, 109, 209);
            justify-content: space-between;
            height: 60px;
            align-items: center;
            padding-right: 8px;
        }

        .home{
            font-weight: bold;
            color: white;
            padding-left: 20px;
        }

        .download{
            color: white;
            border-style: solid;
            border-color: white;
            padding-top: 8px;
            padding-bottom: 8px;
            border-width: 2px;
            padding-left: 16px;
            padding-right: 16px;
        }

        .search{
            width: 800px;
            height: 30px;
            background-color: white;
            color: rgb(158, 156, 156);
            border-radius: 20px;
            padding-left: 20px;
            padding-top: 10px;
        }

    </style>


    <div class="conteiner">
        <div class="home">Home</div>
        <div class="search">Search</div>
        <div class="download">Download</div>
    </div>
</body>
</html>
