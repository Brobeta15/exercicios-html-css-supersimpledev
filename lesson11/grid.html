<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
</head>
<body>
    <div style="
    margin-bottom: 10px;
        display: grid;
        grid-template-columns: 100px 100px 100px;">
        <div style="background-color: aquamarine;"> div 1</div>
        <div style="background-color: lightcoral;"> div 2</div>
        <p style="background-color: beige;">oii</p>
    </div>

    <div style="
        display: grid;
        grid-template-columns: 100px 1fr;">
        <div style="background-color: aquamarine;"> div 1</div>
        <div style="background-color: lightcoral;"> div 2</div>
        
    </div>
    <div style="
        display: grid;
        grid-template-columns: 100px 1fr 1fr;">
        <div style="background-color: aquamarine;"> div 1</div>
        <div style="background-color: lightcoral;"> div 2</div>
        <div style="background-color: aquamarine;"> div 3</div>
    </div>


    <div style="
        column-gap: 20px;
        row-gap: 40px;
        margin-top: 50px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;">
        <div style="background-color: aquamarine; height: 200px;"> div 1</div>
        <div style="background-color: lightcoral; height: 200px;"> div 2</div>
        <div style="background-color: aquamarine; height: 200px;"> div 3</div>
        <div style="background-color: lightcoral; height: 200px;"> div 4</div>
        <div style="background-color: aquamarine; height: 200px;"> div 5</div>
        <div style="background-color: lightcoral; height: 200px;"> div 6</div>
    </div>
</body>
</html>
