<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

        .container{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            column-gap: 20px;
        }

        p{
            font-family: Arial;
        }
        .img-principal{
            width: 200px;
            display: grid;
        }
        .img-amigos{
            width: 35px;
            border-radius: 20px;
            align-items: center;
        }

        
        .p-subtexto{
            margin: 0px;
        }
        .p-nome{
            
            font-weight: bold;
            margin-bottom: 6px;
            margin-left: 8px;
            margin-top: 0px;
            padding-top: 10px;
            /* Nem sempre o margin vai ser a melhor escolha para dar espaçamento, pois o margin vai separar comos se fosse duas coisa diferentes. O padding vai criar o espaçamentos, mas ainda mantendo a continuidade*/
        }
        
        .card-amigos{
            margin-bottom: 10px;
            margin-left: 8px;
            display: grid;
            grid-template-columns: 35px 1fr;
            column-gap: 8px;
            align-items: center;
        }
        button{
            height: 40px;
            width: 120px;
            border: none;
            color: white;
            background-color: rgb(74, 137, 231);
            border-radius: 5px;
            font-size: 16px;
            margin-left: 8px;
            cursor: pointer;
        }
        .card-info{
            width: 200px;
            height: 130px;
            box-shadow: 0px 2px 3px 2px rgb(205, 202, 202);
        }
        
    </style>

    <div class="container">

    <div class="card">
        <div class="perfil">
            <img class="img-principal" src="/lesson10/Kim-Namjoon-2.jpg" alt="">
        </div>
        <div class="card-info">
            <div class="nome">
                <p class="p-nome">Namjoon</p>
            </div>
            <div class="card-amigos">
                <div class="amigos-comum">
                    <img class="img-amigos" src="/lesson10/Kim-Namjoon-2.jpg" alt="">
                </div>
                <div class="subtexto">
                    <p class="p-subtexto">3 mutual friends</p>
                </div>
            </div>
            <div>
                <button>Add Friend</button>
            </div>
        </div>
    </div>

    <div class="card">

                </div>
            </div>
            <div>

    </div>

                </div>
            </div>
            <div>

    </div>
    </div>
</body>
</html>
