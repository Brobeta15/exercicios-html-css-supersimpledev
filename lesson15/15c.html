<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        height: 400000px;
    }
    button{
        background-color: black;
        color: white;
        position: absolute;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        border-style: none;
        left: -12px;
        top: -12px;
        cursor: pointer;
    }
    .quadrado{
        position: fixed;
        width: 320px;
        height: 180px;
        background-color: gray;
        bottom: 25px;
        right: 25px;
    }
</style>
<body>
    
    <div class="quadrado">
        <button>X</button>
    </div>
    
</body>
</html>
