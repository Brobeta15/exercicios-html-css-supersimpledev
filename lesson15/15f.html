<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .fundo{
        position: relative;
        width: 300px;
    }
    img{
        width: 300px;
    }
    .desconto{
        position: absolute;
        background-color: black;
        color: white;
        top: 5px;
        right: 0px;
        width: 90px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        padding-top: 5px;
        padding-bottom: 5px;
    }
    .aba-botao{
        position: absolute;
        background-color: rgba(255, 255, 255, 0.782);
        top:170px;
        bottom: 4px;
        right: 0px;
        left: 0px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    button{
        background-color: white;
        padding-bottom: 8px;
        padding-top: 8px;
        padding-left: 18px;
        padding-right: 18px;
        border-style: solid;
        border-color: black;
        font-weight: bold;
        vertical-align: middle;
    }
</style>
<body>
    <div class="fundo">
        <div class="desconto">20% OFF</div>
        <img src="Red Velvet White Chip Cookie.jpg" alt="">
        <div class="aba-botao">
            <button>Add to Cart</button>
        </div>
    </div>
    
</body>
</html>
