<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        p{
            font-family: Arial;
            margin:0;
            
        }
        .perfil{
            display: inline-block;
            width: 80px;
            height: 80px;
            vertical-align: auto;
            margin-right: 5px;
            
        }

        .imagem{
            width: 70px;
            border-radius: 50px;
        }
        

        .bio{
            display: inline-block;
            width: 180px;
            height: 80px;
        }
        .nome{
            margin-bottom: 8px;
            margin-top: 8px;
            font-weight: bold;
            
        }
        .cargo{
            margin-bottom: 8px;
            font-size: large;
            color: gray;
        }
        .subtexto{
            margin-bottom: 8px;
            color: gray;
        }
        
        button{
            color: white;
            background-color: rgb(77, 140, 235);
            border-style: none;
            width: 70px;
            height: 35px;
            border-radius: 5px;
            font-weight: bold;
            
        }
        .botao{
            display: inline-block;
        }
       
    
    </style>

    <div class="preview">

        <div class="perfil">
            <img class="imagem" src="Kim-Namjoon-2.jpg" alt="">
        </div>

        <div class="bio">
            <div>
                <p class="nome">Namjoom</p>
            </div>
            <div>
                <p class="cargo">The cat</p>
            </div>
            <div>
                <p class="subtexto">Líder</p>
            </div>
        </div>
        <div class="botao">
            <button>Follow</button>
        </div>

    </div>
</body>
</html>
