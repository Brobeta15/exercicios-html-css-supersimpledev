<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

    .principal{
        height: 41px;
        width: 100%;
       
    }
    .section-left{
        position: fixed;
        left: 100px;
        display: flex;
        flex-direction: row;
    }
    .img{
        
    }
    img{
        width: 40px;
        border-radius: 50%;
        margin-right: 10px;
    }
    .title{
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        align-items: center;
        display: flex;
    }

    .section-right{
        position: fixed;
        right: 60px;
        display: flex;
        flex-direction: row;
        align-items: center;
        
    }

    .add-friend{
        background-color: rgb(92, 92, 235);
        border-style: none;
        height: 30px;
        border-radius: 6px;
        color: white;
        width: 90px;
        margin-right: 5px;
        font-weight: bold;
        display: inline-block;
        align-items: center;
    }

    .message{
        border-style: none;
        border-radius: 6px;
        height: 30px;
        width: 90px;
        font-weight: bold;
    }
</style>
<body>
    <div class="principal">
        <div class="section-left">
            <img src="channel-1.jpeg" alt="">
            <div class="title">Oliver Cat</div>
        </div>
        <div class="section-right">
            <button class="add-friend">Add Friend</button>
            <button class="message">Message</button>
        </div>
    </div>
</body>
</html>
