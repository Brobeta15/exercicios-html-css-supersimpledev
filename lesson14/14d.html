<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .overlay{
        background-color: rgba(0, 0, 0, 0.8);
        position: fixed;
        top: 0px; 
        right: 0px; 
        bottom: 0px;
        left: 0px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .modal{
        height: 85px;
        width: 300px;
        background-color: white;
        display: flex;
        flex-direction: column;
        padding: 15px;
        row-gap: 10px;
        
        border-radius: 10px;
        font-family: Arial, Helvetica, sans-serif;
    }
    .title{
        font-weight: bolder;
        font-size: larger;
    }
</style>
<body>
    <div style="position: fixed; width: 100px; background-color: aquamarine; top: 0px; right: 0px; bottom: 0px;">right sidebar</div>

    <div class="overlay">
        <div class="modal">
            <div class="title">Modal Title</div>
            <div>This is a Modal</div>
            <div><button>Close</button></div>
        </div>
    </div>
    
    
</body>
</html>
