<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .div-principal{

        box-shadow: -10px 10px 30px 1px rgb(199, 197, 197);
        height: 150px;
        width: 450px;
        display: flex;
        flex-direction: column;
        border-radius: 6px;
    }

    .titulo{
        color: gray;
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 10px;
        margin-left: 20px;
        margin-bottom: 30px;
    }

    .infos{
        display: flex;
        flex-direction: row;
    }

    img{
        border-radius: 50%;
        width: 55px;
    }

    .foto{
        margin-left: 20px;
        margin-right: 10px;
    }

    .bio{

    }

    .frase1{
        font-weight: bolder;
        font-size: large;
        font-family: Arial, Helvetica, sans-serif;
    }
    .frase2{
        font-weight: bold;
        font-size: medium;
        font-family: Arial, Helvetica, sans-serif;
    }
    .frase3{
        color: gray;
        font-family: Arial, Helvetica, sans-serif;
    }
</style>
<body>
    <div class="div-principal">
        <div class="titulo">ALL INBOXES</div>
        <div class="infos">
            <div class="foto"><img src="channel-1.jpeg" alt=""></div>

            <div class="bio">
                <div class="frase1">Chewys Promotions</div>
                <div class="frase2">Biggest sales of the year!</div>
                <div class="frase3">Hey there! We're writing to tell you about our...</div>
            </div>
        </div>
    </div>
</body>
</html>
