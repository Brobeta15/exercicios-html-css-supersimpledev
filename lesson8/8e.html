<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        p{
            font-family: arial;
            font-size: 34px;
            margin-bottom: 28px;
        }
        input{
            display: block;
            width: 330px;
            height: 35px;
            padding-left: 16px;
            background-color: rgb(231, 229, 229);
            border-style: none;
            margin-bottom: 8px;
            color: gray;
        }

        button{
            border-style: none;
            width: 140px;
            height: 40px;
            margin-top: 26px;
        }
        .button1{
            background-color: black;
            color: white;
            margin-right: 15px;
        }
        .button2{
            background-color: rgb(231, 229, 229);
            color: black;
        }
        
    </style>
    <p>Request a ride now</p>
    <input type="text" placeholder="Enter pickup location">
    <input type="text" placeholder="Enter destination">
    <button class="button1">Request now</button>
    <button class="button2">Schedule for later</button>
</body>
</html>
