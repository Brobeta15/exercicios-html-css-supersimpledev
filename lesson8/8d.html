<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

        input{
            border-style:solid;
            border-color: rgb(177, 177, 177);
            height: 35px;
            border-radius: 8px;
            border-width: 2px;
            padding-left: 12px;
            width: 110px;
        }
        .input-email{
            display: block;
            margin-top: 10px;
            width: 240px;
        }

        button{
            margin-top: 10px;
            display: block;
            width: 257px;
            color: white;
            background-color: rgb(86, 146, 224);
            border-style: none;
            height: 40px;
            border-radius: 8px;
            font-weight: bolder;
            font-size: 15px;
        }

    </style>
    <input type="text" placeholder="First Name">
    <input type="text" placeholder="Last Name">
    <input class="input-email" type="email" placeholder="Email">
    <button >Sign Up</button>
</body>
</html>
